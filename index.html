}
function cartR(){
 const ids=Object.keys(S.cart);
 $("cartL").innerHTML=ids.length?ids.map(id=>{const p=P.find(x=>x[0]==id);return `<div class="row"><span>${thumb(p)}${p[3]}<br><small>${money(p[4])}</small></span><span><button class="btn o" data-q="${id}:-1">−</button> ${S.cart[id]} <button class="btn o" data-q="${id}:1">+</button></span></div>`}).join("")+`<div class="row"><b>${t("total")}</b><b>${money(total())}</b></div><button class="btn" style="width:100%" data-go="checkout">${t("checkout")}</button>`:`<p>${t("empty")}</p>`;
}
function acc(){
 const u=S.user,el=$("v-account");
 if(!u){el.innerHTML=`<div class="panel"><h2 style="margin-top:0">${t("login")} / ${t("register")}</h2><label>${t("name")}</label><input type="text" id="an"><label>${t("email")}</label><input type="email" id="ae"><label>${t("pass")}</label><input type="password" id="ap"><p><button class="btn" id="reg">${t("register")}</button> <button class="btn o" id="log">${t("login")}</button></p></div>`;return}
 el.innerHTML=`<div class="panel"><h2 style="margin-top:0">${t("hello")}, ${esc(u.name)}</h2><label>${t("name")}</label><input type="text" id="an" value="${esc(u.name)}"><label>${t("email")}</label><input type="email" value="${esc(u.email)}" disabled><label>${t("phone")}</label><input type="tel" id="aph" value="${esc(u.phone||"")}"><label>${t("addr")}</label><input type="text" id="aad" value="${esc(u.addr||"")}"><p><button class="btn" id="sv">${t("save")}</button> <button class="btn o" id="out">${t("logout")}</button></p></div><div class="panel"><b>${t("orders")}</b>${S.orders.length?S.orders.map(o=>`<div class="row"><span>#${o.id} · ${o.date}<br><small>${esc(o.pay)}</small></span><b>${money(o.total)}</b></div>`).join(""):`<p>${t("noOrd")}</p>`}</div>`;
}
function sett(){
 $("v-settings").innerHTML=`<div class="panel"><label>${t("theme")}</label><select id="sth">${["auto","light","dark"].map(x=>`<option value="${x}" ${S.set.theme===x?"selected":""}>${t(x)}</option>`).join("")}</select><label>${t("curr")}</label><select id="scu">${["IDR","USD","EUR"].map(x=>`<option ${S.set.curr===x?"selected":""}>${x}</option>`).join("")}</select><label>${t("lang")}</label><select id="sla">${[["en","English"],["id","Indonesia"],["jv","Basa Jawa"],["zh","中文"]].map(x=>`<option value="${x[0]}" ${S.lang===x[0]?"selected":""}>${x[1]}</option>`).join("")}</select><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" id="sno" ${S.set.notif?"checked":""}> ${t("notif")}</label></div>`;
}
function chk(){
 const pays=Object.keys(L.en.pays);
 $("v-checkout").innerHTML=`<div class="panel"><h2 style="margin-top:0">${t("checkout")}</h2>${Object.keys(S.cart).map(id=>{const p=P.find(x=>x[0]==id);return `<div class="row"><span>${p[3]} × ${S.cart[id]}</span><span>${money(p[4]*S.cart[id])}</span></div>`}).join("")}<div class="row"><b>${t("total")}</b><b>${money(total())}</b></div></div><div class="panel pay"><b>${t("payM")}</b>${pays.map((k,i)=>`<label><input type="radio" name="pm" value="${k}" ${i?"":"checked"}> ${t("pays")[k]}</label>`).join("")}<p><button class="btn" id="place">${t("place")}</button></p></div>`;
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button,a");if(!b){const c=e.target.closest("[data-d]");if(c){S.pid=c.dataset.d;show("detail")}return}const d=b.dataset;
 if(d.v)show(d.v);else if(d.c){S.cat=d.c;animNext=true;render();b.scrollIntoView({behavior:"smooth",inline:"center",block:"nearest"})}
 else if(d.w){const i=S.wish.indexOf(d.w);i<0?S.wish.push(d.w):S.wish.splice(i,1);ls.set("k_wish",S.wish);render()}else if(d.a){S.cart[d.a]=(S.cart[d.a]||0)+1;ls.set("k_cart",S.cart);render();toast(t("added"))}
 else if(d.q){const[i,n]=d.q.split(":");S.cart[i]=(S.cart[i]||0)+ +n;if(S.cart[i]<=0)delete S.cart[i];ls.set("k_cart",S.cart);render()}
 else if(d.go){cart(false);if(!S.user){toast(t("need"));show("account")}else show("checkout")}
 else if(b.id==="cartBtn")cart(true);else if(b.id==="cartX")cart(false);
 else if(b.id==="reg"||b.id==="log"){const n=$("an").value.trim(),m=$("ae").value.trim();if(!m||!$("ap").value)return;S.user={name:n||m.split("@")[0],email:m};ls.set("k_user",S.user);render()}
 else if(b.id==="sv"){S.user.name=$("an").value||S.user.name;S.user.phone=$("aph").value;S.user.addr=$("aad").value;ls.set("k_user",S.user);toast(t("saved"));render()}
 else if(b.id==="out"){S.user=null;ls.set("k_user",null);render()}
 else if(b.id==="place"){const pm=document.querySelector("input[name=pm]:checked").value;S.orders.unshift({id:Date.now().toString().slice(-6),date:new Date().toLocaleDateString(),total:total(),pay:t("pays")[pm]});ls.set("k_orders",S.orders);S.cart={};ls.set("k_cart",S.cart);toast(t("ok"));show("account")}
 else if(b.id==="ai"||b.id==="aiX")aiToggle();else if(b.id==="aiSend")aiAsk();
});
document.addEventListener("change",e=>{
 const i=e.target.id;
 if(i==="lang"||i==="sla"){S.lang=e.target.value;ls.set("k_lang",S.lang);render()}
 else if(i==="sth"){S.set.theme=e.target.value;ls.set("k_set",S.set);render()}
 else if(i==="scu"){S.set.curr=e.target.value;ls.set("k_set",S.set);render()}
 else if(i==="sno"){S.set.notif=e.target.checked;ls.set("k_set",S.set)}
});
$("aiIn").addEventListener("keydown",e=>{if(e.key==="Enter")aiAsk()});
let hist=[],sample=null,aiInit=false;
function msg(c,x){const d=document.createElement("div");d.className="m "+c;d.textContent=x;$("msgs").appendChild(d);$("msgs").scrollTop=1e9;return d}
function aiToggle(){$("aiBox").classList.toggle("open");if(!aiInit){aiInit=true;msg("b",t("aiHi"))}}
async function aiAsk(){
 const q=$("aiIn").value.trim();if(!q)return;$("aiIn").value="";msg("u",q);const out=msg("b","…");
 try{
  if(!sample)sample=await claude.use("sample");
  if(!sample){out.textContent=t("aiNo");return}
  const cat=P.map(p=>`${p[3]} (${t("cats")[p[1]]}, Rp${p[4]})`).join("; ");
  hist.push({role:"user",content:q});
  const sys=`You are the shopping assistant of KREASAE, the online shop for Salatiga Eco Park (Central Java, Indonesia) merchandise. Reply in the language with code "${S.lang}" unless the user writes in another. Be concise (max 4 sentences). Catalog: ${cat}. Payments: QRIS, GoPay, OVO, DANA, bank transfer, card, COD. Give general product/usage info only; for herbal products, say they are traditional, not a substitute for medical advice, and suggest a doctor for health conditions. Never invent prices or policies beyond the catalog.\n`;
  const r=await sample([{role:"user",content:sys+"Conversation so far:\n"+hist.slice(0,-1).map(m=>m.role+": "+m.content).join("\n")+"\nuser: "+q}],{cache:false,onText:({text})=>{out.textContent=text}});
  out.textContent=r.text;hist.push({role:"assistant",content:r.text});hist=hist.slice(-10);
 }catch(e){out.textContent=t("aiNo")}
}
function cart(o){$("cartP").classList.toggle("open",o);$("bk").classList.toggle("on",o)}
$("bk").onclick=()=>cart(false);
document.addEventListener("keydown",e=>{if(e.key==="Escape"){cart(false);$("aiBox").classList.remove("open")}});
let animNext=true;
function fb(el){const p=P.find(x=>x[0]===el.dataset.id);if(!p)return;const[bg,s]=A[p[1]](+p[0].slice(-1)-1),w=el.parentNode;w.style.background=bg;w.innerHTML=`<svg viewBox="0 0 120 100">${s}</svg>`}
document.addEventListener("error",e=>{if(e.target&&e.target.tagName==="IMG")fb(e.target)},true);
setTimeout(()=>document.querySelectorAll(".rv:not(.in)").forEach(el=>el.classList.add("in")),3500);
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);setTimeout(()=>e.target.style.transitionDelay="",1400)}}),{threshold:.12});
function reveal(now){let i=0;document.querySelectorAll("#v-shop .card,#v-shop .vid,#v-shop h2,#v-wish .card,.panel").forEach(el=>{if(el.classList.contains("rv"))return;el.classList.add("rv");if(now)el.classList.add("in");else{el.style.transitionDelay=(i++%6)*70+"ms";io.observe(el)}})}
addEventListener("scroll",()=>{const h=document.documentElement;$("pg").style.transform="scaleX("+Math.min(1,scrollY/Math.max(1,h.scrollHeight-innerHeight))+")"},{passive:true});
$("q").addEventListener("input",e=>{S.q=e.target.value.trim().toLowerCase();if(S.view==="shop")render()});
render();
</script></body></html>
